<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light-only design: stops browsers (e.g. Chrome Android auto-dark) from inverting the palette. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#9b1118" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Moonlight Photo Studio — preserve your most beautiful moments and plan a memory wall for your home."
    />
    <title>Moonlight Photo Studio</title>
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx): no third-party requests. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif; text-align: center">
        Moonlight Photo Studio needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
